<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Registered Here!</h1>
    <form method="post">
        <div class="firstname-box">
            <label for="firstname-box">First Name:</label>
            <input type="text" name="firstname" id="firstname-box" class="input-field" placeholder="Enter Your First Name" required>
        </div>

            <div class="lastname-box">
                <label for="lastname-box">Last Name:</label>
                <input type="text" name="lastname" id="lastname-box" class="input-field" placeholder="Enter Your Last Name" required>
            </div>

            <div class="username-box">
                <label for="username-box">Username:</label>
                <input type="text" name="username" id="username-box" class="input-field" placeholder="Enter Your Username" required>
        </div>

        <div class="email-box">
            <label for="email-box">Email:</label>
            <input type="email" name="email" id="email-box" class="input-field" placeholder="Enter Your Email" required>
        </div>

        <div class="password-box">
            <label for="password-box">Password:</label>
            <input type="password" name="password" id="password-box" class="input-field" placeholder="Enter Your Password" required>
        </div>
        
        <div class="button-submit">
            <button type="submit" class="submit-button">Login</button>
        </div>
    </form>
</body>
</html>
