<!DOCTYPE html>
<html>
    <head>
        <title> Css: Embed font face</title>
        <style>
            @font-face {
                font-family: "Myfont";
                src: url("Yujima.woff") format("woff");
            }
            h1,p{
                font-family: "Myfont", serif;
            }
            body{
                background-color:antiquewhite;
            }
        </style>
    </head>
    <body>
        <h1> Hello World</h1>
        <p> This is a paragraph</p> 
    </body>
</html>
